version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 1
    rebase-strategy: "auto"
    group:
      "all-docker-updates":
        patterns:
          - "**/*"
    commit-message:
      prefix: "chore"
      include: "scope"
      scope: "deps"
